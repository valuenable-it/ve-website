<!DOCTYPE html>
<html lang="en">
<head>

  <title>ValuEnable - Check Application Status</title>
  <link rel="stylesheet" href="assets/css/check-status.css"/>
  <link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet'>
  <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<body>
    <div id="loader-container" class="loader-container">
        <div class="loader"></div>
      </div>
  <div class="status-container">
    <header class="status-header">
      <div class="status-logo">
        <div class="status-logo-icon">
          <a href="index.html"><img src="images/logo.png" alt="ValuEnable"/></a>
        </div>
      </div>
      <div class="support-link"><a href="#support">Need Support?</a></div>
    </header>

    <main class="status-main-content">
      <div class="form-section">
        <p class="status-form-title">Check Application Status</p>
        <p class="status-form-subtitle">Enter Details below to check your loan application status:</p>
        
        <form id="statusForm" class="status-form">
              <div class="form-group status-form-group">
                        <label for="insuranceCompany">Insurance Company Name</label>
                        <div class="select-wrapper">
                            <select id="insuranceCompany" name="insuranceCompany" required>
                                <option value="" selected>Select Insurance Company</option>
                              <option value="IPRU">ICICI Prudential Life Insurance</option>
                                    <option value="HDFC">HDFC Life Insurance Co. Ltd.</option>
                                    <option value="TATA">Tata AIA Life Insurance Co. Ltd.</option>
                                    <option value="METLIFE">PNB MetLife India Insurance Co. Ltd</option>
                            </select>
                            <span class="select-arrow">▼</span>
                        </div>
                    </div>
          <div class="status-form-group form-group">
            <label for="policyNumber">Enter Policy Number</label>
            <input class="status-policy-input" type="text" id="policyNumber" name="policyNumber" required>
          </div>
          <button type="submit" class="check-status-btn">Check Status ></button>
        </form>

        <div><p id="pending-stage" class="pending-stage-text"></p></div>
         <div class="continue-button-box" >
            <p class="continue-button-text" id="continue-button" style="display: none;" onclick="openOtpModal()">Continue Application ></p>
        </div>
      </div>

      <div class="status-section">
        <p class="status-title">Application Status</p>
        <div class="status-timeline" id="statusTimeline"></div>
       

      </div>
      

      <footer class="footer">
        <div class="footer-left">
          <span class="footer-copyright">©ValuEnable 2025</span>
          <a href="https://www.valuenable.in/terms-condition.html" target="_blank" class="footer-link">Terms & Conditions</a>
          <a href="https://www.valuenable.in/privacy.html"  target="_blank"  class="footer-link">Privacy Policy</a>
        </div>
        <div class="footer-right">
          <a href="https://wa.me/message/USGKHQQ7JRM7D1" target="_blank" class="social-link whatsapp"><img src="images/Social_Media_Logo_whatsapp.svg"/></a>
          <a href="https://www.linkedin.com/company/valuenable" target="_blank" class="social-link linkedin"><img src="images/Social_Media_Logo_linkdin.svg"/></a>
        </div>
      </footer>
    </main>
    <div id="otpModal" class="modal-overlay">
        <div class="check-status-modal-content modal-content">
            <div class="modal-header check-status-modal-header">
                <h2 class="modal-title check-status-modal-title ">Verify OTP</h2>
                <button class="close-btn check-status-close-btn" id="closeModal">&times;</button>
            </div>

            <div class="modal-body check-status-modal-body">
                <p class="check-status-otp-message">We have sent a 6-digit OTP to your registered mobile number</p>
                <div class="check-status-otp-input-container">
                    <input type="text" inputmode="numeric" class="check-status-otp-input" maxlength="1" data-index="0">
                    <input type="text" inputmode="numeric" class="check-status-otp-input" maxlength="1" data-index="1">
                    <input type="text" inputmode="numeric" class="check-status-otp-input" maxlength="1" data-index="2">

                </div>
                <div class="check-status-modal-actions">

                    <button onclick="resendOtp()" class="check-status-resend-btn" id="resendOtp" disabled>Resend OTP</button>
                </div>
            </div>
        </div>
    </div>
  </div>

          if (detail === "Loan Disbursed") { cls = "completed"; icon = '<img src="images/right.svg" alt="✓" width="16" height="16">'; }
          if (step.title === "Loan Initiated") stepClass = "completed";
          if (step.title === "KYC Verification") stepClass = "completed";
           if (step.title === "Securities Validation") stepClass = "completed";
          if (step.title === "Loan Disbursed") stepClass = "completed";

           if (detail === "Loan Sanctioned (e-agreement sign)") { cls = "completed"; icon = '<img src="images/right.svg" alt="✓" width="16" height="16">'; }
           if (detail === "Assignment signing stage") { cls = "completed"; icon = '<img src="images/right.svg" alt="✓" width="16" height="16">'; }
            if (detail === "Mandate") { cls = "completed"; icon = '<img src="images/right.svg" alt="✓" width="16" height="16">'; }
            if (step.title === "Signing Stage") stepClass = "completed";
            if (step.title === "Mandate") stepClass = "completed";

                 }
        }

        return `<div class="detail-item"><label class="${cls}">${icon}</label > <label >${detail}</label ></div>`;
      }).join("");

      container.innerHTML += `
        <div class="status-step ${stepClass}" data-step="${i+1}">
          <div class="step-indicator"><span class="step-number">${i+1}</span></div>
          <div class="step-content">

          </div>
          <button class="expand-btn"><i class="fa fa-angle-${i===0 ? "up":"down"}"></i></button>
        </div>`;
    });

    initAccordion(current, next);

  function initAccordion() {
    // Attach handlers to expand buttons (safe guard)
    document.querySelectorAll(".expand-btn").forEach(btn => {
      btn.removeEventListener?.("click", btn._timelineClick); // try to remove previous handler if any
      const handler = function () {
        // collapse all
        document.querySelectorAll(".step-details").forEach(d => d.style.display = "none");
        document.querySelectorAll(".expand-btn").forEach(b => b.innerHTML = '<i class="fa fa-angle-down"></i>');
        const details = this.closest(".status-step").querySelector(".step-details");
        if (!details) return;
        if (details.style.display === "none" || details.style.display === "") {
          details.style.display = "block";
          this.innerHTML = '<i class="fa fa-angle-up"></i>';
        }
      };
      btn.addEventListener("click", handler);
      // keep reference so we can remove later if needed
      btn._timelineClick = handler;
    });
  }

          policy_number: policyNumber,

        }, {
          headers: { "x-api-key": "pGP5lpARtk9zc71e2DNSlaizwxtSqt5g3pdXQDZa" }

        const { current_stage, next_stage, v_kyc,isContinueJourney,pendingStage } = res.data || {};

let pendingText = document.getElementById("pending-stage");
if (pendingText) {

  function closeOtpModal() {
    if (!otpModal) return;

    if (timerInterval) clearInterval(timerInterval);
    resetOtpForm();
  }

  function resetOtpForm() {
    if (!otpInputs) return;
    otpInputs.forEach(input => {
      input.value = '';
      input.classList.remove('filled');
    });
    timeLeft = 30;
    if (resendOtpBtn) resendOtpBtn.disabled = true;
    if (verifyOtpBtn) verifyOtpBtn.disabled = true;
    if (otpTimer) otpTimer.textContent = `Resend OTP in ${timeLeft}s`;
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timeLeft = 30;
    if (resendOtpBtn) resendOtpBtn.disabled = true;
    if (otpTimer) otpTimer.textContent = `Resend OTP in ${timeLeft}s`;
    timerInterval = setInterval(() => {
      timeLeft--;
      if (otpTimer) otpTimer.textContent = `Resend OTP in ${timeLeft}s`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        if (otpTimer) otpTimer.textContent = 'You can now resend OTP';
        if (resendOtpBtn) resendOtpBtn.disabled = false;
      }
    }, 1000);
  }

  // Close modal events
  if (closeModal) {
    closeModal.addEventListener('click', closeOtpModal);
  }

  if (otpModal) {
    otpModal.addEventListener('click', function (e) {
      if (e.target === otpModal) {
        closeOtpModal();
      }
    });
  }

  // OTP Input handling
  if (otpInputs && otpInputs.length) {
    otpInputs.forEach((input, index) => {
      input.addEventListener('input', function (e) {
        const value = e.target.value;
        // Only allow single number
        if (!/^\d$/.test(value)) {
          e.target.value = '';
          return;
        }
        if (value) {
          e.target.classList.add('filled');
          if (index < otpInputs.length - 1) {
            otpInputs[index + 1].focus();
          }
        } else {
          e.target.classList.remove('filled');
        }
        checkOtpComplete();
      });

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          otpInputs[index - 1].focus();
          otpInputs[index - 1].value = '';
          otpInputs[index - 1].classList.remove('filled');
        }
      });

// Desktop paste
input.addEventListener('paste', function (e) {
  if (e.clipboardData) { // only desktop
    e.preventDefault();
    const pastedData = e.clipboardData.getData('text') || '';
    const digits = pastedData.replace(/\D/g, '').slice(0, otpInputs.length);
    digits.split('').forEach((digit, i) => {
      if (otpInputs[i]) {
        otpInputs[i].value = digit;
        otpInputs[i].classList.add('filled');
      }
    });
    for (let i = 0; i < otpInputs.length; i++) {
      if (!otpInputs[i].value) {
        otpInputs[i].focus();
        break;
      }
    }
    checkOtpComplete();
  }
});

// Mobile-friendly input (long press or clipboard paste)
input.addEventListener('input', function (e) {
  const value = e.target.value;
  if (value.length > 1) {
    const digits = value.replace(/\D/g, '').slice(0, otpInputs.length);
    digits.split('').forEach((digit, i) => {
      if (otpInputs[i]) {
        otpInputs[i].value = digit;
        otpInputs[i].classList.add('filled');
      }
    });
    for (let i = 0; i < otpInputs.length; i++) {
      if (!otpInputs[i].value) {
        otpInputs[i].focus();
        break;
      }
    }
    checkOtpComplete();
  } else {
    // single digit input
    if (/^\d$/.test(value)) {
      e.target.classList.add('filled');
    } else {
      e.target.value = '';
      e.target.classList.remove('filled');
    }
  }
});

    if (!otpInputs || !verifyOtpBtn) return;
    const otp = Array.from(otpInputs).map(input => input.value).join('');
    verifyOtpBtn.disabled = otp.length !== otpInputs.length;
